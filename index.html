<!DOCTYPE html> <html lang="ar"> <head> <meta charset="UTF-8"> <title>Facebook - تسجيل الدخول</title> <style> body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: #f0f2f5; } .header { background: #1877f2; color: white; padding: 15px; font-size: 24px; text-align: center; font-weight: bold; } .container { display: flex; justify-content: center; align-items: center; height: 80vh; } .login-box { background: white; padding: 20px; width: 320px; border-radius: 10px; box-shadow: 0 0 15px rgba(0,0,0,0.2); text-align: center; } input { width: 90%; padding: 12px; margin: 10px 0; border-radius: 6px; border: 1px solid #ccc; } button { width: 95%; padding: 12px; background: #1877f2; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; } button:hover { background: #166fe5; } .note { margin-top: 15px; font-size: 12px; color: gray; } </style> </head> <body> <div class="header">facebook</div> <div class="container"> <div class="login-box"> <h3>تسجيل الدخول إلى فيسبوك</h3> <input type="text" id="email" placeholder="البريد الإلكتروني أو رقم الهاتف"> <input type="password" id="password" placeholder="كلمة المرور"> <button onclick="fakeLogin()">تسجيل الدخول</button> <div class="note">⚠️ هذه صفحة تدريبية وليست شغالة nezk </div> </div> </div> <script> function fakeLogin() { let email = document.getElementById("email").value; let pass = document.getElementById("password").value; alert("🔍 تدريب فقط:\n\nالإيميل: " + email + "\nكلمة المرور: " + pass); } </script> </body> </html>
